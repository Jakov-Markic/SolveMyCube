name: solve_my_cube
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  camera: ^0.12.0+1
  image: ^4.9.1
  permission_handler: ^12.0.3
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  flutter_pytorch: ^1.0.1
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^15.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/best.ptl
    - assets/models/best.torchscript
    - assets/models/best_tensor.ptl
    - assets/models/best_tensor.torchscript
    - assets/models/cube_labels.txt
    - assets/models/rubik_labels.txt